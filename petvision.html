<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetVision – ¿Perro o Gato?</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <style>
    :root {
      --bg: #f6f2ff;
      --surface: #ffffff;
      --text: #1b1b2c;
      --muted: #686b80;
      --primary: #6d40ea;
      --primary-soft: #f5f0ff;
      --border: #e8e3ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top left, #efe8ff 0%, #faf8ff 40%, #ffffff 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .layout { width: min(760px, 100%); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 32px rgba(63, 33, 140, 0.12);
      padding: 20px;
    }

    .title { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
    .subtitle { margin: 0 0 14px; font-size: 13px; color: var(--muted); }

    .image-wrap {
      position: relative;
      width: 100%;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: #f0ecff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      text-align: center;
      color: var(--muted);
      pointer-events: none;
    }
    .placeholder span { font-size: 48px; display: block; margin-bottom: 8px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-soft {
      border-radius: 10px;
      padding: 11px 12px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #d8cbff;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .btn-soft:hover { background: #ede4ff; }

    .btn-main {
      border-radius: 10px;
      padding: 12px 12px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      background: linear-gradient(100deg, #7445eb, #5f33d8);
      color: #fff;
      border: none;
      margin-top: 10px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-main:hover { opacity: 0.9; }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.5;
      display: none;
    }
    .result.visible { display: block; }

    .result-animal {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .result-conf { color: var(--muted); font-size: 13px; margin-bottom: 8px; }

    .progress {
      height: 10px;
      background: #ece6ff;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7a4ef0, #5f33d8);
      border-radius: 999px;
      transition: width 0.5s ease;
      width: 0%;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    input[type="file"] { display: none; }

    @media (max-width: 680px) {
      .image-wrap { height: 220px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="layout">
    <article class="card">
      <h1 class="title">🐾 PetVision</h1>
      <p class="subtitle">Sube una foto y el modelo de IA dirá si es un perro o un gato</p>

      <div class="image-wrap" id="imageWrap">
        <div class="placeholder" id="placeholder">
          <span>🐶🐱</span>
          Sube una imagen de tu mascota
        </div>
        <img id="preview" alt="Imagen de mascota" />
      </div>

      <div class="actions" style="grid-template-columns:1fr">
        <label class="btn-soft" for="fileInput">📤 Subir imagen</label>
      </div>
      <input type="file" id="fileInput" accept="image/*" />

      <button class="btn-main" id="analyzeBtn" disabled>✨ Analizar</button>

      <div class="result" id="result">
        <div class="result-animal" id="resultAnimal"></div>
        <div class="result-conf" id="resultConf"></div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>

      <div class="status" id="status">Cargando modelo…</div>
    </article>
  </section>

  <!-- Canvas oculto para pre-procesar imagen -->
  <canvas id="canvas" style="display:none" width="100" height="100"></canvas>

  <script>
    // ── Configuración ──────────────────────────────────────────────
    const MODEL_PATH = './carpeta_salida/model.json';
    const IMG_SIZE   = 100;   // el modelo fue entrenado con 100×100 px

    // ── Estado ─────────────────────────────────────────────────────
    let model = null;
    let imageLoaded = false;

    // ── DOM ─────────────────────────────────────────────────────────
    const preview     = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const fileInput   = document.getElementById('fileInput');
    const analyzeBtn  = document.getElementById('analyzeBtn');
    const resultDiv   = document.getElementById('result');
    const resultAnimal= document.getElementById('resultAnimal');
    const resultConf  = document.getElementById('resultConf');
    const progressBar = document.getElementById('progressBar');
    const statusEl    = document.getElementById('status');
    const canvas      = document.getElementById('canvas');
    const ctx         = canvas.getContext('2d');

    // ── Cargar modelo al inicio ─────────────────────────────────────
    (async () => {
      try {
        model = await tf.loadLayersModel(MODEL_PATH);
        statusEl.textContent = 'Modelo listo ✓ — sube una imagen para analizar';
        if (imageLoaded) analyzeBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = '⚠️ No se pudo cargar el modelo: ' + e.message;
      }
    })();

    // ── Subir imagen desde archivo ──────────────────────────────────
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      loadImageFile(URL.createObjectURL(file));
    });

    function loadImageFile(src) {
      preview.src = src;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      imageLoaded = true;
      resultDiv.classList.remove('visible');
      analyzeBtn.disabled = !model;
      statusEl.textContent = model
        ? 'Imagen lista — haz clic en Analizar'
        : 'Esperando que cargue el modelo…';
    }

    // ── Analizar ────────────────────────────────────────────────────
    analyzeBtn.addEventListener('click', async () => {
      if (!model || !imageLoaded) return;

      analyzeBtn.disabled = true;
      statusEl.textContent = 'Analizando…';

      // Pre-procesar: escalar a 100×100, escala de grises, normalizar
      ctx.drawImage(preview, 0, 0, IMG_SIZE, IMG_SIZE);
      const imageData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE);

      const tensor = tf.tidy(() => {
        const raw = tf.browser.fromPixels(imageData, 1); // 1 canal = gris
        return raw.toFloat().div(255).reshape([1, IMG_SIZE, IMG_SIZE, 1]);
      });

      const prediction = await model.predict(tensor).data();
      tensor.dispose();

      // El modelo devuelve un valor en [0,1]:  0 = gato,  1 = perro
      const score = prediction[0];
      const esPerro = score >= 0.5;
      const confianza = esPerro ? score : 1 - score;
      const pct = Math.round(confianza * 100);

      resultAnimal.textContent  = esPerro ? '🐶 PERRO' : '🐱 GATO';
      resultConf.textContent    = `Confianza: ${pct}%`;
      progressBar.style.width   = pct + '%';

      resultDiv.classList.add('visible');
      analyzeBtn.disabled = false;
      statusEl.textContent = '¡Análisis completado!';
    });
  </script>
</body>
</html>
